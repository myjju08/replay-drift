# Generator training — latent space, B/2 + MAE-640
# Dual-drift vector field:
#   loss = || x - sg(x + alpha * V_rev + (1 - alpha) * V_fwd) ||^2
#
#   V_rev : drift_loss_imagenet (gen-centric grid), R_list = [0.2, 0.05, 0.02]
#   V_fwd : drift_loss_imagenet_colwise (col-wise softmax + coupling),
#           R_list = [0.4, 0.10, 0.04]   (temp ×2)
#
# Both vector fields use the SAME rev-baseline-sized (gen, pos, neg) features
# and weights. The dual-specific differences are the fwd/rev matching schemes,
# branch temperatures, and adaptive coefficient below.
#
# alpha schedule: ADAPTIVE data hedge without time-logit.
#   alpha = coefficient on V_rev; 1-alpha = coefficient on V_fwd.
#   alpha1/beta1 are raw gen/pos coverage diagnostics.
#   Hedge uses capacity-normalized a/b with common denominator min(N_gen, N_pos),
#   so unequal N_gen=64 and N_pos=128 do not bias the expert losses.
#   gamma_eff = gamma * step / total_steps
#   L_b = gamma_eff * (1 - a), L_v = gamma_eff * (1 - b)
#   log_w_b <- (1 - decay) * log_w_b - eta * L_b
#   log_w_v <- (1 - decay) * log_w_v - eta * L_v
#   alpha = sigmoid(log_w_b - log_w_v)
#   Initial alpha=0.5 matches the original officialsetup_try3 run: equal
#   reverse- and forward-drift coefficients at step 0.
# No time-logit or linear alpha ramp is used.
#
# All reference hyperparameters match the saved
# gen_B2_mix_dualdrift_mae640_officialsetup_try3 checkpoint config. The only
# intentional experimental changes are stochastic feature-stage loss selection
# and post-Hedge pruning below.

logging:
  project: "ImageNet - B2"
  entity: "a01065522071-kaist-digital-humanities-and-social-science"
  use_wandb: true
  log_every_k: 10
  wandb_rewind_on_resume: false

env:
  imagenet_path: "/home1/irteam/data-vol1/osilab/hojung/data/imagenet_kaggle/ILSVRC2012"
  cache_path: "/home1/irteam/data-vol1/osilab/hojung/data/image_test/image_latents"

dataset:
  resolution: 256
  use_aug: false
  use_latent: true
  use_cache: true
  num_classes: 1000
  batch_size: 10 # 16
  eval_batch_size: 8
  num_workers: 8
  pin_memory: true

model:
  cond_dim: 768
  input_size: 32
  in_channels: 4
  patch_size: 2
  hidden_size: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  out_channels: 4
  use_qk_norm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 16
  noise_classes: 64
  noise_coords: 32
  use_bf16: true
  attn_fp32: false # true
  use_remat: true

optimizer:
  lr: 0.0004  
  weight_decay: 0.0
  adam_b1: 0.9
  adam_b2: 0.95
  warmup_steps: 2000 # 10000
  lr_schedule: "const"

train:
  seed: 42
  total_steps: 200000
  save_per_step: 5000 # 1563 # 12511
  eval_per_step: 5000 # 5000
  eval_samples: 1024
  eval_at_start: false
  ema_decay: 0.999
  max_grad_norm: 2.0 # 2.0
  keep_every: 3000
  keep_last: 20
  pos_per_sample: 128
  neg_per_sample: 32
  positive_bank_size: 128 # 128
  negative_bank_size: 1000 # 1000
  banks_per_rank: 1  # emulate two independent official host-local banks per GPU rank
  push_per_step: 128 # 128
  loader_batch_size: 128 # 128
  push_at_resume: 0
  gen_per_label: 64
  cfg_min: 1.0
  cfg_max: 4.0
  neg_cfg_pw: 3.0 # 5.0 previously
  no_cfg_frac: 0.0
  drift_matching: "dual-drift"
  # Reuse one normalized [gen | neg | pos] distance grid for both experts.
  # This halves per-feature cdist calls without retaining a second full grid.
  dual_drift_share_distances: true
  R_list: [0.4, 0.10, 0.04]           # fwd-drift branch temperature (×2)
  mix_baseline_R_list: [0.2, 0.05, 0.02]  # rev-drift branch temperature (original)
  # Dense softmax coupling is the default. Values below 1.0 enable the
  # experimental groupwise nucleus truncation path.
  rev_drift_top_p: 1.0
  fwd_drift_top_p: 1.0
  drift_top_p_min_keep: 1
  # Experimental asymmetric fixed support: reverse drift keeps target columns
  # per generated row; forward drift keeps generated rows per target column.
  # Zero preserves the dense default.
  drift_top_k_pos: 0
  drift_top_k_neg: 0
  mix_alpha_adaptive: true            # see MixAlphaTracker.compute_mix_alpha
  mix_alpha_adaptive_mode: "hedge_no_time"  # discounted winner-ratio hedge, time_logit=0
  mix_alpha_adaptive_initial: 0.0      # match original run: 1/2 rev + 1/2 fwd at step 0
  mix_alpha_horizon_steps: 100000      # reach full gamma after 100 generated-sample epochs
  mix_alpha_adaptive_gamma: 8.0       # gamma_eff = gamma * clamp(step / mix_alpha_horizon_steps, 0, 1)
  mix_alpha_adaptive_eta: 1.0e-4      # hedge step size
  mix_alpha_adaptive_decay: 1.0e-4    # discounted memory; log_w starts from initial-alpha prior
  mix_alpha_adaptive_gamma_warmup_steps: 0  # ignored by hedge_no_time
  global_scale_stats: true # false -> compute S_j / scale per process
  global_fnorm_stats: true # false -> compute batch f_norm per process
  compute_wpos_stats: true
  compute_wpos_stats_every_k: 1000
  # Uniformly sample 2/4 MAE stage-loss groups each step. The selected groups
  # receive inverse-probability weight 2, preserving the full loss in
  # expectation. global/norm_x stay active; conv1 is grouped with stage1.
  # Feature extraction and full layer1..4 Hedge winner statistics stay dense.
  stochastic_feature_stage_loss: false
  stochastic_feature_stage_count: 2
  stochastic_feature_stage_seed: 42
  # After full layer1..4 Hedge statistics, release zero-loss feature tensors
  # before selected drift losses/backward. This does not change the objective.
  prune_skipped_feature_tensors: false
  activation_kwargs:
    patch_mean_size: [2, 4]
    patch_std_size: [2, 4]
    use_std: true
    use_mean: true
    with_global: true
    every_k_block: 2
  cfg_list: [1.0, 2.0, 3.0]

feature:
  mae_checkpoint: "/home/irteam/data-vol1/osilab/hojung/dualdrift/weights/pt/mae_latent_640/ckpt_latest.pt"
  mae_use_remat: true
  use_convnext: false
  feature_adapter: false
  feature_adapter_objective: "supcon"
  feature_adapter_keys: ["layer1", "layer2", "layer3", "layer4"]
  feature_adapter_dropout: 0.0
  feature_adapter_lr: 0.0001
  feature_adapter_weight_decay: 0.0
  feature_adapter_update_freq: 1
  feature_adapter_temp: 0.07
  feature_adapter_reg_lambda: 0.0
  feature_adapter_loss_weight: 1.0
