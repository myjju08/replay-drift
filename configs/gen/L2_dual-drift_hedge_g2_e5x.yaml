# Generator training — latent space, L/2 + MAE-640
# Dual-drift vector field:
#   loss = || x - sg(x + alpha * V_rev + (1 - alpha) * V_fwd) ||^2
#
#   V_rev : drift_loss_imagenet (gen-centric grid)
#           cfg-batch-slice ON, R_list = [0.2, 0.05, 0.02]   (original temp)
#   V_fwd : drift_loss_imagenet_colwise (col-wise softmax + coupling)
#           cfg-batch-slice ON, R_list = [0.4, 0.10, 0.04]   (temp ×2)
#
# alpha schedule: ADAPTIVE — discounted hedge + logit-form time bias.
#   t          = step / total_steps                       in [0, 1]
#   gamma_eff: 0 for step < W; γ·(step−W)/(T−W) for W ≤ step ≤ T   (W = T/2)
#   L_b        = gamma_eff * (1 - α1)            # data-only, no time term
#   L_v        = gamma_eff * (1 - β1)
#   ℓ_b ← (1 - decay) * ℓ_b − eta * L_b          # hedge accumulates data
#   ℓ_v ← (1 - decay) * ℓ_v − eta * L_v
#   mix_alpha = sigmoid( (ℓ_b - ℓ_v) + log(t / (1-t)) )
#   t→0: log(t/(1-t))→-∞ ⇒ mix_alpha→0  (pure fwd-drift at start, guaranteed)
#   t→1: log(t/(1-t))→+∞ ⇒ mix_alpha→1  (pure rev-drift at end, guaranteed)
#   data_logit shifts the crossover timing based on (α1-β1).
#
# Hyperparameters (preset 3 = "responsive", η×5):
#   gamma=2.0, eta=5e-4, decay=1e-4, gamma_warmup_steps=125114 (= T/2)
#   - eta=5e-4 (5× the default) gives a stronger per-step data update.
#     η/decay = 5 ⇒ data-driven log-diff has ~5× the steady-state
#     amplitude of g2. Trajectory crosses to baseline-dominant earlier
#     after the γ ramp begins (step T/2):
#       step 200k: versionb_coef ≈ 0.094  (vs ≈ 0.174 for g2 default)
#   - W=T/2 same as g2/g4: first half is pure linear (γ_eff=0).
#   - γ=2.0 same as g2: data-signal scale unchanged; eta is the dial.
#
# All other hyperparameters identical to
# latent_L2_mix_adaptive_closedform_mae640_ncls8_gpu01234567_neg32.yaml.

logging:
  project: "ImageNet - L2"
  entity: "a01065522071-kaist-digital-humanities-and-social-science"
  use_wandb: true
  log_every_k: 10
  wandb_rewind_on_resume: false

env:
  imagenet_path: "/NHNHOME/WORKSPACE/dualdrift/data/imagenet/ILSVRC2012"
  cache_path: "/NHNHOME/WORKSPACE/dualdrift/data/imagenet/latent_cache_sd_vae_mse"

dataset:
  resolution: 256
  use_aug: false
  use_latent: true
  use_cache: true
  num_classes: 1000
  batch_size: 4
  eval_batch_size: 2
  num_workers: 8
  pin_memory: true

model:
  cond_dim: 1024
  input_size: 32
  in_channels: 4
  patch_size: 2
  hidden_size: 1024
  depth: 24
  num_heads: 16
  mlp_ratio: 4.0
  out_channels: 4
  use_qk_norm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 16
  noise_classes: 64
  noise_coords: 32
  use_bf16: false
  attn_fp32: false
  use_remat: true

optimizer:
  lr: 0.0002
  weight_decay: 0.01
  adam_b1: 0.9
  adam_b2: 0.95
  warmup_steps: 10000
  lr_schedule: "const"

train:
  seed: 42
  total_steps: 250228
  save_per_step: 25022
  eval_per_step: 5000
  eval_samples: 1024
  eval_at_start: false
  ema_decay: 0.999
  max_grad_norm: 2.0
  keep_every: 25022
  keep_last: 2
  pos_per_sample: 16
  neg_per_sample: 28      # max neg_k = total_budget(32) - pos_min(4) = 28
  positive_bank_size: 128
  negative_bank_size: 1000
  push_per_step: 128
  push_at_resume: 0
  gen_per_label: 16
  cfg_min: 1.0
  cfg_max: 4.0
  neg_cfg_pw: 3.0
  no_cfg_frac: 0.5
  use_cfg_weight_neg: false
  weight_neg_const: 1.0
  cfg_batch_slice: true               # per-batch single CFG; slice BEFORE MAE
  cfg_ratio_pos_base: 16
  cfg_ratio_pos_min: 4
  cfg_ratio_total_budget: 32          # pos_k + neg_k = 32 every step
  drift_matching: "dual-drift"
  R_list: [0.4, 0.10, 0.04]           # fwd-drift branch temperature (×2)
  mix_baseline_R_list: [0.2, 0.05, 0.02]  # rev-drift branch temperature (original)
  mix_alpha_adaptive: true
  mix_alpha_adaptive_mode: "hedge"    # "exp" | "sigmoid" | "closed_form" | "hedge"
  mix_alpha_adaptive_scale: 1.0       # ignored in hedge mode
  mix_alpha_adaptive_gamma: 2.0       # data-signal scale on (1-α1), (1-β1)
  mix_alpha_adaptive_eta: 5.0e-4      # hedge step size (5× g2 → stronger data response)
  mix_alpha_adaptive_decay: 1.0e-4    # ℓ_i discount per step (0 = vanilla hedge)
  mix_alpha_adaptive_gamma_warmup_steps: 125114 # γ=0 until T/2, then linear ramp 0→γ over [T/2, T]
  mix_alpha_start_step: 0             # ignored when mix_alpha_adaptive=true
  mix_alpha_end_step: 250228          # ignored when mix_alpha_adaptive=true
  self_mask_on_raw: false
  compute_wpos_stats: true
  compute_wpos_stats_every_k: 1000
  activation_kwargs:
    patch_mean_size: [2, 4]
    patch_std_size: [2, 4]
    use_std: true
    use_mean: true
    every_k_block: 2
  cfg_list: [1.0, 2.0, 3.0]

feature:
  mae_checkpoint: "/NHNHOME/WORKSPACE/dualdrift/weights/pt/mae_latent_640/ckpt_latest.pt"
  use_convnext: false
  feature_adapter: false
  feature_adapter_objective: "supcon"
  feature_adapter_keys: ["layer1", "layer2", "layer3", "layer4"]
  feature_adapter_dropout: 0.0
  feature_adapter_lr: 0.0001
  feature_adapter_weight_decay: 0.0
  feature_adapter_update_freq: 1
  feature_adapter_temp: 0.07
  feature_adapter_reg_lambda: 0.0
  feature_adapter_loss_weight: 1.0
