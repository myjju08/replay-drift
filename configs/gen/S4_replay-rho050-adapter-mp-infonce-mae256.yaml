# S/4 rho=0.5 replay drift with an alternating MAE stage-3/4 adapter.
# The adapter objective is generated-anchor -> real-candidate multi-positive
# InfoNCE. x_gen features are detached; generator and adapter use separate
# optimizer steps. Candidate negatives are rank-local (4 classes x 32 real).

logging:
  project: "Replay Drift - S4 model"
  entity: "a01065522071-kaist-digital-humanities-and-social-science"
  name: "S4-replay-rho050-adapter-mpinfonce-g32p32-stage34-seed43-40ep-srv02-preopt-20260902"
  use_wandb: true
  log_every_k: 10
  wandb_rewind_on_resume: false

env:
  imagenet_path: ""
  cache_path: "/home/juhyeong/idrift-data/imagenet/latent_cache_sd_vae_mse"

dataset:
  resolution: 256
  use_aug: false
  use_latent: true
  use_cache: true
  cache_format: "pt_imagefolder"
  num_classes: 1000
  batch_size: 4
  eval_batch_size: 8
  num_workers: 8
  pin_memory: true

model:
  cond_dim: 384
  input_size: 32
  in_channels: 4
  patch_size: 4
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  out_channels: 4
  use_qk_norm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 16
  noise_classes: 64
  noise_coords: 32
  use_bf16: true
  attn_fp32: false
  use_remat: false
  use_sdpa: false

optimizer:
  lr: 0.0004
  weight_decay: 0.0
  adam_b1: 0.9
  adam_b2: 0.95
  warmup_steps: 2000
  lr_schedule: "const"

train:
  seed: 43
  seed_host_rng: true
  total_steps: 200000
  total_generated_epochs: 40.0
  save_per_step: 5000
  save_per_generated_epochs: 10.0
  # 1,281,167 train latents / (B=4 x 2 ranks x G=32): 10 epochs = 50,046 steps.
  # Keep the final evaluation, but avoid rank-0-only mid-run DDP offloading.
  eval_per_step: 400000
  eval_per_generated_epochs: 10.0
  eval_samples: 1024
  eval_at_start: true
  ema_decay: 0.999
  max_grad_norm: 2.0
  keep_every: 3000
  keep_last: 20
  pos_per_sample: 32
  neg_per_sample: 32
  positive_bank_size: 128
  negative_bank_size: 1000
  banks_per_rank: 1
  push_per_step: 128
  loader_batch_size: 128
  # Refill roughly 80k distinct latents per rank on resume so the adapter's
  # class banks return to the 32-real readiness threshold immediately.
  push_at_resume: 625
  gen_per_label: 32
  cfg_min: 1.0
  cfg_max: 4.0
  neg_cfg_pw: 3.0
  no_cfg_frac: 0.0
  drift_matching: "rev-drift"
  R_list: [0.2, 0.05, 0.02]
  rev_drift_affinity_kernel: "exponential"
  rev_drift_kernel_shape: 1.0
  rev_drift_kernel_adaptive_k_pos: 0
  rev_drift_kernel_adaptive_k_neg: 0
  rev_drift_force_multiplier: 1.0
  rev_drift_top_p: 1.0
  drift_top_p_min_keep: 1
  drift_top_k_pos: 0
  drift_top_k_neg: 0
  drift_top_k_groups: "all"
  layer_temperature_profile: "uniform"
  layer_temperature_profiles:
    uniform: {stage1: 1.0, stage2: 1.0, stage3: 1.0, stage4: 1.0}
  feature_loss_profile: "no_stage12_norm_x2"
  feature_loss_group_normalize: true
  prune_skipped_feature_tensors: true
  feature_loss_profiles:
    no_stage12_norm_x2:
      default: 1.0
      norm_x: 2.0
      stage1: 0.0
      stage2: 0.0
  global_scale_stats: true
  global_fnorm_stats: true
  compute_wpos_stats: true
  compute_wpos_stats_every_k: 1000
  activation_kwargs:
    active_stages: [stage3, stage4]
    patch_mean_size: [2, 4]
    patch_std_size: [2, 4]
    use_std: true
    use_mean: true
    with_global: true
    every_k_block: 2
  cfg_list: [1.0, 2.0, 3.0]
  cfg_uncond_split: false
  historical_gen_replay: true
  historical_gen_replay_ratio: 0.5
  historical_gen_replay_count: 16
  historical_gen_replay_bank_count: 16
  historical_gen_replay_start_generated_epochs: 10.0
  historical_gen_replay_storage_dtype: "float16"
  historical_gen_replay_source: "frozen_snapshot"
  historical_gen_replay_ratio_start: null
  historical_gen_replay_ratio_ramp_start_step: 0
  historical_gen_replay_ratio_ramp_end_step: 0
  historical_gen_current_weight: null
  historical_gen_history_weight: null
  # Match the existing S/4 pre-opt comparison: level 3, no remat/SDPA/TF32.
  throughput_opt_level: 3
  allow_tf32: false
  cudnn_benchmark: false
  cudnn_benchmark_limit: 10
  diagnostics_every_k: 10

feature:
  mae_checkpoint: "/home/juhyeong/idrift-data/imagenet/mae_latent_256/ckpt_latest.pt"
  mae_use_remat: false
  use_convnext: false
  feature_adapter: true
  feature_adapter_objective: "gen_real_multipos_infonce"
  feature_adapter_keys: ["layer3", "layer4"]
  feature_adapter_bottleneck: 64
  feature_adapter_projection_dim: 128  # ignored: objective uses adapted GAP directly
  feature_adapter_dropout: 0.0
  feature_adapter_lr: 0.0001
  feature_adapter_weight_decay: 0.0
  feature_adapter_adam_b1: 0.9
  feature_adapter_adam_b2: 0.999
  feature_adapter_update_freq: 1
  feature_adapter_samples_per_class: 32
  feature_adapter_generated_samples_per_class: 32
  # Wait until every class bank holds 32 distinct entries. ArrayMemoryBank then
  # samples without replacement for the adapter objective.
  feature_adapter_require_distinct_real: true
  feature_adapter_temp: 0.1
  feature_adapter_loss_weight: 1.0
  feature_adapter_generated_anchor_weight: 1.0
  feature_adapter_real_anchor_weight: 0.0
  feature_adapter_global_negatives: false
  feature_adapter_ce_weight: 0.0
  feature_adapter_reg_lambda: 0.0
  feature_adapter_max_grad_norm: 1.0
  # Hard-copy online -> target after each adapter step; target is frozen during
  # the next generator forward/backward.
  feature_adapter_ema_decay: 0.0
  feature_gan: false
