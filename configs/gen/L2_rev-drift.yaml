# Generator training — latent space, L/2 baseline + MAE-640
# Aligned with drifting-official-jax/configs/gen/latent_sota_L.yaml except:
#   - batch_size: 2048 -> 8 (5090 x4 vs TPU pod)
#   - N_pos/N_neg/G: 64/32/64 -> 16/16/16 (smaller compute budget)
# Matched to jax sota_L:
#   - model: L/2 (cond_dim/hidden_size=1024, depth=24, num_heads=16)
#   - use_bf16 = true
#   - optimizer: warmup=10000, weight_decay=0.01 (lr=2e-4 kept from small)
#   - attn_fp32 = false, neg_cfg_pw = 3.0, no_cfg_frac = 0.5 (paper L/2 / jax sota_L)
#   - total_steps = 125114, save every 12511 steps
#   - cfg_list = jax sota grid

logging:
  project: "ImageNet - L2"
  entity: "a01065522071-kaist-digital-humanities-and-social-science"
  use_wandb: true
  log_every_k: 10
  wandb_rewind_on_resume: false

env:
  imagenet_path: "/NHNHOME/WORKSPACE/dualdrift/data/imagenet/ILSVRC2012"
  cache_path: "/NHNHOME/WORKSPACE/dualdrift/data/imagenet/latent_cache_sd_vae_mse"

dataset:
  resolution: 256
  use_aug: false
  use_latent: true
  use_cache: true
  num_classes: 1000
  batch_size: 4
  eval_batch_size: 2
  num_workers: 8
  pin_memory: true

model:
  cond_dim: 1024
  input_size: 32
  in_channels: 4
  patch_size: 2
  hidden_size: 1024
  depth: 24
  num_heads: 16
  mlp_ratio: 4.0
  out_channels: 4
  use_qk_norm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 16
  noise_classes: 64
  noise_coords: 32
  use_bf16: false
  attn_fp32: false
  use_remat: true

optimizer:
  lr: 0.0002
  weight_decay: 0.01
  adam_b1: 0.9
  adam_b2: 0.95
  warmup_steps: 10000
  lr_schedule: "const"

train:
  seed: 42
  total_steps: 250228
  save_per_step: 25022
  eval_per_step: 5000
  eval_samples: 1024
  eval_at_start: false
  ema_decay: 0.999
  max_grad_norm: 2.0
  keep_every: 25022
  keep_last: 2
  pos_per_sample: 16
  neg_per_sample: 16
  positive_bank_size: 128
  negative_bank_size: 1000
  push_per_step: 128
  push_at_resume: 0
  gen_per_label: 16
  cfg_min: 1.0
  cfg_max: 4.0
  neg_cfg_pw: 3.0
  no_cfg_frac: 0.5
  R_list: [0.2, 0.05, 0.02]
  compute_wpos_stats: true
  compute_wpos_stats_every_k: 1000
  activation_kwargs:
    patch_mean_size: [2, 4]
    patch_std_size: [2, 4]
    use_std: true
    use_mean: true
    every_k_block: 2
  cfg_list: [1.0, 2.0, 3.0]

feature:
  mae_checkpoint: "/NHNHOME/WORKSPACE/dualdrift/weights/pt/mae_latent_640/ckpt_latest.pt"
  use_convnext: false
  feature_adapter: false
  feature_adapter_objective: "supcon"
  feature_adapter_keys: ["layer1", "layer2", "layer3", "layer4"]
  feature_adapter_dropout: 0.0
  feature_adapter_lr: 0.0001
  feature_adapter_weight_decay: 0.0
  feature_adapter_update_freq: 1
  feature_adapter_temp: 0.07
  feature_adapter_reg_lambda: 0.0
  feature_adapter_loss_weight: 1.0
