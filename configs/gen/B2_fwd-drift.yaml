# Generator training — latent space, B/2 + MAE-640 + fwd-drift + cfg-batch-slice + TEMP×2
# Differences from rev-drift B/2:
#   - drift_matching: "fwd-drift"  (col-wise softmax + coupling)
#   - self_mask_on_raw: false      (rev-drift self-mask: +100 AFTER scaling)
#   - cfg_batch_slice: true        (per-batch single CFG; slice pos/neg BEFORE MAE
#                                   so MAE forward sees exactly pos+neg=32 columns
#                                   per sample → memory matches rev-drift 16x48 matrix)
#       cfg=cfg_min → pos=16, neg=16  (budget=32)
#       cfg=cfg_max → pos=4 , neg=28  (budget=32 preserved)
#       fractional pos_k uses stochastic rounding (e.g. 14.2 → 14 w.p. 0.8)
#   - use_cfg_weight_neg: false    (weights all 1; CFG influence is via sample count)
#   - R_list: [0.2, 0.05, 0.02] → [0.4, 0.10, 0.04]   (softmax temperature ×2)
# All other hyperparameters identical to the rev-drift B/2 config.

logging:
  project: "ImageNet - B2"
  entity: "a01065522071-kaist-digital-humanities-and-social-science"
  use_wandb: true
  log_every_k: 10
  wandb_rewind_on_resume: false

env:
  imagenet_path: "/NHNHOME/WORKSPACE/dualdrift/data/imagenet/ILSVRC2012"
  cache_path: "/NHNHOME/WORKSPACE/dualdrift/data/imagenet/latent_cache_sd_vae_mse"

dataset:
  resolution: 256
  use_aug: false
  use_latent: true
  use_cache: true
  num_classes: 1000
  batch_size: 8
  eval_batch_size: 2
  num_workers: 8
  pin_memory: true

model:
  cond_dim: 768
  input_size: 32
  in_channels: 4
  patch_size: 2
  hidden_size: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  out_channels: 4
  use_qk_norm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 16
  noise_classes: 64
  noise_coords: 32
  use_bf16: false
  attn_fp32: false
  use_remat: true

optimizer:
  lr: 0.0002
  weight_decay: 0.0
  adam_b1: 0.9
  adam_b2: 0.95
  warmup_steps: 10000
  lr_schedule: "const"

train:
  seed: 42
  total_steps: 125114
  save_per_step: 12511
  eval_per_step: 5000
  eval_samples: 1024
  eval_at_start: false
  ema_decay: 0.999
  max_grad_norm: 2.0
  keep_every: 12511
  keep_last: 2
  pos_per_sample: 16
  neg_per_sample: 28      # max neg_k = total_budget(32) - pos_min(4) = 28
  positive_bank_size: 128
  negative_bank_size: 1000
  push_per_step: 128
  push_at_resume: 0
  gen_per_label: 16
  cfg_min: 1.0
  cfg_max: 4.0
  neg_cfg_pw: 5.0
  no_cfg_frac: 0.0
  use_cfg_weight_neg: false
  weight_neg_const: 1.0
  cfg_batch_slice: true               # per-batch single CFG; slice BEFORE MAE
  cfg_ratio_pos_base: 16
  cfg_ratio_pos_min: 4
  cfg_ratio_total_budget: 32          # pos_k + neg_k = 32 every step
  R_list: [0.4, 0.10, 0.04]
  drift_matching: "fwd-drift"
  self_mask_on_raw: false
  compute_wpos_stats: true
  compute_wpos_stats_every_k: 1000
  activation_kwargs:
    patch_mean_size: [2, 4]
    patch_std_size: [2, 4]
    use_std: true
    use_mean: true
    every_k_block: 2
  cfg_list: [1.0, 2.0, 3.0]

feature:
  mae_checkpoint: "/NHNHOME/WORKSPACE/dualdrift/weights/pt/mae_latent_640/ckpt_latest.pt"
  use_convnext: false
  feature_adapter: false
  feature_adapter_objective: "supcon"
  feature_adapter_keys: ["layer1", "layer2", "layer3", "layer4"]
  feature_adapter_dropout: 0.0
  feature_adapter_lr: 0.0001
  feature_adapter_weight_decay: 0.0
  feature_adapter_update_freq: 1
  feature_adapter_temp: 0.07
  feature_adapter_reg_lambda: 0.0
  feature_adapter_loss_weight: 1.0
