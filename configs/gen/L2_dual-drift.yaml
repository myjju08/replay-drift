# Generator training — latent space, L/2 + MAE-640
# Dual-drift vector field:
#   loss = || x - sg(x + alpha * V_rev + (1 - alpha) * V_fwd) ||^2
#
#   V_rev : drift_loss_imagenet (gen-centric grid)
#           cfg-batch-slice ON, R_list = [0.2, 0.05, 0.02]   (original temp)
#   V_fwd : drift_loss_imagenet_colwise (col-wise softmax + coupling)
#           cfg-batch-slice ON, R_list = [0.4, 0.10, 0.04]   (temp ×2)
#
# Both vector fields use the SAME (gen, pos, neg) features and weights — only
# the matching scheme and softmax temperature differ. Cfg slicing happens once
# (cfg_batch_slice=true) so pos/neg counts and feature compute match the
# fwd-drift config exactly.
#
# alpha schedule: linear 0 → 1 over [mix_alpha_start_step, mix_alpha_end_step].
# Defaults span the full run: alpha=0 at step 0 (pure fwd-drift),
# alpha=1 at the final step (pure rev-drift).
#
# All other hyperparameters identical to
# latent_L2_fwd-drift_cfgratio_temp2x_mae640_ncls8_gpu01234567_neg32.yaml.

logging:
  project: "ImageNet - L2"
  entity: "a01065522071-kaist-digital-humanities-and-social-science"
  use_wandb: true
  log_every_k: 10
  wandb_rewind_on_resume: false

env:
  imagenet_path: "/NHNHOME/WORKSPACE/dualdrift/data/imagenet/ILSVRC2012"
  cache_path: "/NHNHOME/WORKSPACE/dualdrift/data/imagenet/latent_cache_sd_vae_mse"

dataset:
  resolution: 256
  use_aug: false
  use_latent: true
  use_cache: true
  num_classes: 1000
  batch_size: 4
  eval_batch_size: 2
  num_workers: 8
  pin_memory: true

model:
  cond_dim: 1024
  input_size: 32
  in_channels: 4
  patch_size: 2
  hidden_size: 1024
  depth: 24
  num_heads: 16
  mlp_ratio: 4.0
  out_channels: 4
  use_qk_norm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 16
  noise_classes: 64
  noise_coords: 32
  use_bf16: false
  attn_fp32: false
  use_remat: true

optimizer:
  lr: 0.0002
  weight_decay: 0.01
  adam_b1: 0.9
  adam_b2: 0.95
  warmup_steps: 10000
  lr_schedule: "const"

train:
  seed: 42
  total_steps: 250228
  save_per_step: 25022
  eval_per_step: 5000
  eval_samples: 1024
  eval_at_start: false
  ema_decay: 0.999
  max_grad_norm: 2.0
  keep_every: 25022
  keep_last: 2
  pos_per_sample: 16
  neg_per_sample: 28      # max neg_k = total_budget(32) - pos_min(4) = 28
  positive_bank_size: 128
  negative_bank_size: 1000
  push_per_step: 128
  push_at_resume: 0
  gen_per_label: 16
  cfg_min: 1.0
  cfg_max: 4.0
  neg_cfg_pw: 3.0
  no_cfg_frac: 0.5
  use_cfg_weight_neg: false
  weight_neg_const: 1.0
  cfg_batch_slice: true               # per-batch single CFG; slice BEFORE MAE
  cfg_ratio_pos_base: 16
  cfg_ratio_pos_min: 4
  cfg_ratio_total_budget: 32          # pos_k + neg_k = 32 every step
  drift_matching: "dual-drift"
  R_list: [0.4, 0.10, 0.04]           # fwd-drift branch temperature (×2)
  mix_baseline_R_list: [0.2, 0.05, 0.02]  # rev-drift branch temperature (original)
  mix_alpha_start_step: 0             # alpha = 0 at this step (pure fwd-drift)
  mix_alpha_end_step: 250228          # alpha = 1 at this step (pure rev-drift)
  self_mask_on_raw: false
  compute_wpos_stats: true
  compute_wpos_stats_every_k: 1000
  activation_kwargs:
    patch_mean_size: [2, 4]
    patch_std_size: [2, 4]
    use_std: true
    use_mean: true
    every_k_block: 2
  cfg_list: [1.0, 2.0, 3.0]

feature:
  mae_checkpoint: "/NHNHOME/WORKSPACE/dualdrift/weights/pt/mae_latent_640/ckpt_latest.pt"
  use_convnext: false
  feature_adapter: false
  feature_adapter_objective: "supcon"
  feature_adapter_keys: ["layer1", "layer2", "layer3", "layer4"]
  feature_adapter_dropout: 0.0
  feature_adapter_lr: 0.0001
  feature_adapter_weight_decay: 0.0
  feature_adapter_update_freq: 1
  feature_adapter_temp: 0.07
  feature_adapter_reg_lambda: 0.0
  feature_adapter_loss_weight: 1.0
