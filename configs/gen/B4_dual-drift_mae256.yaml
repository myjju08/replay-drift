# Generator training — latent space, B/4 + official latent MAE-256
#
# Cheap ablation matched to B2_dual-drift.yaml. Intentional changes only:
#   1. generator patch_size: 2 -> 4 (32x32 latent grid: 256 -> 64 tokens),
#   2. feature encoder: official mae_latent_640 -> mae_latent_256.
#
# The feature encoder retains input_patch_size=1, so it sees the original
# 32x32 latent grid without patch/downsampling. The dual-drift loss, top-p
# dense drift settings, full feature-layer loss, and adaptive Hedge schedule
# otherwise match the B/2 comparison setup.
#
# mix_alpha is the reverse-drift coefficient; 1-mix_alpha is forward drift.
# initial mix_alpha=0 starts effectively forward-only. hedge_no_time then uses
# the capacity-normalized winner ratios to update the two discounted experts.

logging:
  project: "ReplayDrift"
  entity: null  # use the account selected by the local W&B login
  use_wandb: true
  log_every_k: 10
  wandb_rewind_on_resume: false

env:
  imagenet_path: "/home1/irteam/data-vol1/osilab/hojung/data/imagenet_kaggle/ILSVRC2012"
  cache_path: "/home1/irteam/data-vol1/osilab/hojung/data/image_test/image_latents"

dataset:
  resolution: 256
  use_aug: false
  use_latent: true
  use_cache: true
  num_classes: 1000
  batch_size: 10
  eval_batch_size: 8
  num_workers: 8
  pin_memory: true

model:
  cond_dim: 768
  input_size: 32
  in_channels: 4
  patch_size: 4
  hidden_size: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  out_channels: 4
  use_qk_norm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 16
  noise_classes: 64
  noise_coords: 32
  use_bf16: true
  attn_fp32: false
  use_remat: true

optimizer:
  lr: 0.0004
  weight_decay: 0.0
  adam_b1: 0.9
  adam_b2: 0.95
  warmup_steps: 2000
  lr_schedule: "const"

train:
  seed: 42
  total_steps: 200000
  save_per_step: 5000
  eval_per_step: 5000
  eval_samples: 1024
  eval_at_start: false
  ema_decay: 0.999
  max_grad_norm: 2.0
  keep_every: 3000
  keep_last: 20
  pos_per_sample: 128
  neg_per_sample: 32
  positive_bank_size: 128
  negative_bank_size: 1000
  banks_per_rank: 1
  push_per_step: 128
  loader_batch_size: 128
  push_at_resume: 0
  gen_per_label: 64
  cfg_min: 1.0
  cfg_max: 4.0
  neg_cfg_pw: 3.0
  no_cfg_frac: 0.0
  drift_matching: "dual-drift"
  dual_drift_share_distances: true
  R_list: [0.4, 0.10, 0.04]
  mix_baseline_R_list: [0.2, 0.05, 0.02]
  # Dense softmax coupling by default; values below 1.0 opt into top-p.
  rev_drift_top_p: 1.0
  fwd_drift_top_p: 1.0
  drift_top_p_min_keep: 1
  # Experimental asymmetric fixed support: reverse drift keeps target columns
  # per generated row; forward drift keeps generated rows per target column.
  # Zero preserves the dense default.
  drift_top_k_pos: 0
  drift_top_k_neg: 0
  mix_alpha_adaptive: true
  mix_alpha_adaptive_mode: "hedge_no_time"
  mix_alpha_adaptive_initial: 0.0
  mix_alpha_horizon_steps: 100000
  mix_alpha_adaptive_gamma: 8.0
  mix_alpha_adaptive_eta: 1.0e-4
  mix_alpha_adaptive_decay: 1.0e-4
  mix_alpha_adaptive_gamma_warmup_steps: 0
  global_scale_stats: true
  global_fnorm_stats: true
  compute_wpos_stats: true
  compute_wpos_stats_every_k: 1000
  stochastic_feature_stage_loss: false
  stochastic_feature_stage_count: 2
  stochastic_feature_stage_seed: 42
  prune_skipped_feature_tensors: false
  activation_kwargs:
    patch_mean_size: [2, 4]
    patch_std_size: [2, 4]
    use_std: true
    use_mean: true
    with_global: true
    every_k_block: 2
  cfg_list: [1.0, 2.0, 3.0]

feature:
  mae_checkpoint: "/home/irteam/data-vol1/osilab/hojung/dualdrift/weights/pt/mae_latent_256/ckpt_latest.pt"
  mae_use_remat: true
  use_convnext: false
  feature_adapter: false
  feature_adapter_objective: "supcon"
  feature_adapter_keys: ["layer1", "layer2", "layer3", "layer4"]
  feature_adapter_dropout: 0.0
  feature_adapter_lr: 0.0001
  feature_adapter_weight_decay: 0.0
  feature_adapter_update_freq: 1
  feature_adapter_temp: 0.07
  feature_adapter_reg_lambda: 0.0
  feature_adapter_loss_weight: 1.0
