# Generator training — latent space, B/2 baseline + MAE-640
# Aligned with drifting-official-jax/configs/gen/latent_sota_B.yaml except:
#   - batch_size: 2048 -> 8 (5090 x4 vs TPU pod)
#   - N_pos/N_neg/G: 64/32/64 -> 16/16/16 (smaller compute budget)
# Matched to jax sota_B:
#   - model: B/2 (cond_dim/hidden_size=768, depth=12, num_heads=12)
#   - use_bf16 = true
#   - optimizer: warmup=10000, weight_decay=0.0 (lr=2e-4 kept from small)
#   - attn_fp32 = false, neg_cfg_pw = 5.0 (jax sota_B values)
#   - total_steps = 125114, save every 12511 steps
#   - cfg_list = jax sota grid

logging:
  project: "ImageNet - B2"
  entity: "a01065522071-kaist-digital-humanities-and-social-science"
  use_wandb: true
  log_every_k: 10
  wandb_rewind_on_resume: false

env:
  imagenet_path: "/home1/irteam/data-vol1/osilab/hojung/data/imagenet_kaggle/ILSVRC2012"
  cache_path: "/home1/irteam/data-vol1/osilab/hojung/data/image_test/image_latents"

dataset:
  resolution: 256
  use_aug: false
  use_latent: true
  use_cache: true
  num_classes: 1000
  batch_size: 10 # 16
  eval_batch_size: 8
  num_workers: 8
  pin_memory: true

model:
  cond_dim: 768
  input_size: 32
  in_channels: 4
  patch_size: 2
  hidden_size: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  out_channels: 4
  use_qk_norm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 16
  noise_classes: 64
  noise_coords: 32
  use_bf16: true
  attn_fp32: false # true
  use_remat: true

optimizer:
  lr: 0.0004  
  weight_decay: 0.0
  adam_b1: 0.9
  adam_b2: 0.95
  warmup_steps: 2000 # 10000
  lr_schedule: "const"

train:
  seed: 42
  total_steps: 200000 # 15636 # 125114
  save_per_step: 5000 # 1563 # 12511
  eval_per_step: 5000 # 5000
  eval_samples: 1024
  eval_at_start: false
  ema_decay: 0.999
  max_grad_norm: 2.0 # 2.0
  keep_every: 3000
  keep_last: 20
  pos_per_sample: 128
  neg_per_sample: 32
  positive_bank_size: 128 # 128
  negative_bank_size: 1000 # 1000
  banks_per_rank: 1  # emulate two independent official host-local banks per GPU rank
  push_per_step: 128 # 128
  loader_batch_size: 128 # 128
  push_at_resume: 0
  gen_per_label: 64
  cfg_min: 1.0
  cfg_max: 4.0
  neg_cfg_pw: 3.0 # 5.0 previously
  no_cfg_frac: 0.0
  R_list: [0.2, 0.05, 0.02]
  # Dense softmax coupling is the default. Values below 1.0 enable the
  # experimental groupwise nucleus truncation path.
  rev_drift_top_p: 1.0
  drift_top_p_min_keep: 1
  # Experimental row-wise targets retained per generated sample. Zero keeps
  # the dense default.
  drift_top_k_pos: 0
  drift_top_k_neg: 0
  global_scale_stats: true # false -> compute S_j / scale per process
  global_fnorm_stats: true # false -> compute batch f_norm per process
  compute_wpos_stats: true
  compute_wpos_stats_every_k: 1000
  activation_kwargs:
    patch_mean_size: [2, 4]
    patch_std_size: [2, 4]
    use_std: true
    use_mean: true
    with_global: true
    every_k_block: 2
  cfg_list: [1.0, 2.0, 3.0]

feature:
  mae_checkpoint: "/home1/irteam/data-vol1/osilab/hojung/dualdrift/weights/pt/mae_latent_640/ckpt_latest.pt"
  mae_use_remat: true
  use_convnext: false
  feature_adapter: false
  feature_adapter_objective: "supcon"
  feature_adapter_keys: ["layer1", "layer2", "layer3", "layer4"]
  feature_adapter_dropout: 0.0
  feature_adapter_lr: 0.0001
  feature_adapter_weight_decay: 0.0
  feature_adapter_update_freq: 1
  feature_adapter_temp: 0.07
  feature_adapter_reg_lambda: 0.0
  feature_adapter_loss_weight: 1.0
